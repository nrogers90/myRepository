<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>React Project</title>
    
    <style>
body {
    animation: fadeIn 2s;
}

@keyframes fadeIn {
    from {
        opacity: 0;
    }
    to {
        opacity: 1;
    }
}

.form-popup {
    display: none;
    position: fixed;
    bottom: 20px;
    right: 20px;
    border: 3px solid #ccc;
    background: white;
    padding: 20px;
    width: 300px;
    box-shadow: 0 4px 10px rgba(0,0,0,0.3);
}

.form-container input,
.form-container textarea {
    width: 100%;
    margin-bottom: 10px;
}

.form-container button {
    width: 100%;
    margin-top: 10px;
}

.moveButton {
    position: fixed;
    bottom: 20px;
    right: 20px;
    padding: 15px 20px;
    animation: pulseButton 1.5s infinite;
    z-index: 1000;
}

@keyframes pulseButton {
    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.2);
    }

    100% {
        transform: scale(1);
    }
}

.zoomImage {
    display: block;
    width: 400px;
    margin: 20px auto;
    animation: zoomInOut 5s infinite;
}

@keyframes zoomInOut {
    0% {
        transform: scale(1);
    }

    50% {
        transform: scale(1.2);
    }

    100% {
        transform: scale(1);
    }
}

html {
    scroll-behavior: smooth;
}

.slides {
    display: none;
    width: 500px;
    margin: auto;
}

</style>

</head>
<body>
    

<a href="#top">Top</a> |
<a href="#contact">Contact Form</a> |
<a href="#image">Image</a>

<h1 id="top" style="font-size:8vw;">Hello Universe!</h1>
<p style="font-size:2vw;">This text is going to resize itself based on the window!</p>

<h2 id="contact">Contact Form</h2>
<form name="contactForm" onsubmit="return validateForm()">

    <label>Name:</label><br>
    <input type="text" name="name"><br><br>

    <label>Email:</label><br>
    <input type="email" name="email"><br><br>

    <label>Phone Number:</label><br>
    <input type="tel" name="phone"><br><br>

    <input type="submit" value="Submit">

</form>


<div class="form-popup" id="myForm">
    <form class="form-container" onsubmit="return false;">
        <h2>Contact Us</h2>

        <label>Name</label>
        <input type="text" placeholder="Enter Name">

        <label>Email</label>
        <input type="email" placeholder="Enter Email">

        <label>Message</label>
        <textarea placeholder="Type your message"></textarea>

        <button type="button">Send</button>
        <button type="button" onclick="closeForm()">Close</button>
    </form>
</div>

<button type="button" class="moveButton" onclick="openForm()">Contact Us</button>

<img id="image" src="three_cliffs.jpg" alt="Three Cliffs Bay" class="zoomImage">


<h2>Gower</h2>
<hr> <!-- Horizontal Rule -->

<div class="slideshow">
    <img class="slides" src="gower_1.jpg" alt="Gower">
    <img class="slides" src="gower_2.jpg" alt="Gower">
    <img class="slides" src="gower_3.jpg" alt="Gower">
</div>

<script>
function validateForm() {

    let name = document.forms["contactForm"]["name"].value;
    let email = document.forms["contactForm"]["email"].value;
    let phone = document.forms["contactForm"]["phone"].value;

    if (name == "" || email == "" || phone == "") {
        alert("Please fill in all fields.");
        return false;
    }

    return true;
}

function openForm() {
    document.getElementById("myForm").style.display = "block";
}

function closeForm() {
    document.getElementById("myForm").style.display = "none";
}

let slideIndex = 0;
showSlides();

function showSlides() {
    let slides = document.getElementsByClassName("slides");

    for (let i = 0; i < slides.length; i++) {
        slides[i].style.display = "none";
    }

    slideIndex++;

    if (slideIndex > slides.length) {
        slideIndex = 1;
    }

    slides[slideIndex - 1].style.display = "block";

    setTimeout(showSlides, 3000);
}

</script>

</body>


</html>
