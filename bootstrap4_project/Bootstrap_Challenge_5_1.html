<!doctype html>
<html lang="en">
  <head>
    <!-- Required meta tags -->
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">

    <!-- Bootstrap CSS -->
    
    <style>
      body{
        padding-top: 60px;
      }
        .center {
          display: block;
          margin-left: auto;
          margin-right: auto;
          width: 50%;
          filter: grayscale(100%);
          border: 2px solid rgb(1, 1, 1);
          border-radius: 25px;
        }

        footer {
          text-align: center;
          margin-top: 25px;
        }

        footer p {
          font-weight: bold;
        }

        table, th, td {
          border: 1px solid rgb(101, 10, 10);
          border-collapse: collapse;
          padding: 20px;
        }

        table th {
          background-color: rgb(247, 38, 10);
        }

        .img-container {
          position: relative;
          width: 50%;
          margin-left: auto;
          margin-right: auto;
        }

        .centered {
          position: absolute;
          top: 20%;
          left: 50%;
          transform: translate(-50%, -50%);
          color: white;
          font-size: 32px;
          font-weight: bold;
          text-shadow: 2px 2px 8px black;
        }
      .navbar {
  overflow: hidden;
  background-color: #ff1919;
  position: fixed; /* Set the navbar to fixed position */
  top: 0; /* Position the navbar at the top of the page */
  width: 100%; /* Full width */
}


/* Base style for mobile devices */
body {
  background-color: olive;
  color: white;
}

/* For devices with a minimum width of 768px (Medium) */
@media screen and (min-width: 768px) {
  body {
    background-color: rgb(55, 215, 63);
    color: white;
  }
}

/* For devices with a minimum width of 992px (Large) */
@media screen and (min-width: 992px) {
  body {
    background-color: rgb(232, 217, 197);
    color: black;
  }
}

/* Links inside the navbar */
.navbar a {
  float: left;
  display: block;
  color: #000000;
  text-align: center;
  padding: 14px 16px;
  text-decoration: none;
  margin-top:auto
}

/* Change background on mouse-over */
.navbar a:hover {
  background: #c8fb6f;
  color: black;
}

/* Main content */
.main {
  margin-top: 30px; 
}

/* Challenge 5-6 */ 
.column {
  float: left;
  width: 50%;
}

/* Clear floats after the columns */
.row:after {
  content: "";
  display: table;
  clear: both;
}
  
/* Hover effect for challenge 5-7 */
.hover-effect {
  background-color: cadetblue;
  padding: 15px;
}

.hover-effect:hover {
  background-color:darkred;
  color: white;
}

/* 5-8 hover */

.overlay {
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  opacity: 0;
  transition: .3s ease;
  background-color: rgba(0,0,0,0.6);
  border-radius: 25px;
}

/* 5-10 video overlay */
.video-overlay {
  position: relative;
  width: 50%;
  margin: 20px auto;
}

.video-overlay video {
  width: 100%;
  display: block;
}

.overlay-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  color: white;
  font-size: 32px;
  font-weight: bold;
  text-shadow: 2px 2px 8px black;
}

.img-container:hover .overlay {
  opacity: 1;
}

.overlay-text {
  color: white;
  font-size: 20px;
  position: absolute;
  top: 50%;
  left: 50%;
  -webkit-transform: translate(-50%, -50%);
  -ms-transform: translate(-50%, -50%);
  transform: translate(-50%, -50%);
  text-align: center;
}

/* paragraph turns blue below 600px */
@media screen and (max-width: 600px) {
  p {
    color: blue;
  }
}
    </style>

  
    <title>Webpage Challenges</title>
  </head>
  <body>

<div class="navbar">
  <a href="#home">Home</a>

  <a href="#home?">Contact</a>
</div>

<div class="main">
  <p>This is text about...</p>
</div>

<div class="img-container">
  <img src="./Img/img_paris.jpg" alt="Paris" class="center">
  <div class="centered">Paris</div>
  <div class="overlay">
    <div class="overlay-text">Overlay Text!</div>
  </div>
</div>

  <table>
  <tr>
    <th>Row 1</th>
    <th>Row 2</th>
    <th>Row 3</th>
  </tr>
  <tr>
    <td>Test 1</td>
    <td>Test 2</td>
    <td>Test 3</td>
  </tr>
  <tr>
    <td>Test 4</td>
    <td>Test 5</td>
    <td>Test 6</td>
  </tr>
</table>

<!-- challenge 5-6 -->

<div class="row">

<!-- challenge 5 - 9 (video) -->

  </video>
  <div class="overlay-text">HELLO</div>
</div>

<!-- end of challenge 5 - 9 (video) -->

</footer>

  </body>
</html>
