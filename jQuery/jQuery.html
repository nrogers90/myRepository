<!DOCTYPE html>
<html>
<head>
<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.4.0/jquery.min.js"></script>
</head>

<script>
// Wait until the document has fully loaded before running jQuery
$(document).ready(function() {
    // Add HTML content 
    $("html").append(
        "<body>\
            <div id='container'>\
                <div id='inner'>\
                    <h1>Basic jQuery</h1>\
                    <p id='1'>Paragraph 1</p>\
                    <p id='2'>Paragraph 2</p>\
                    <p id='3'>Paragraph 3</p>\
                </div>\
            </div>\
        </body>"
    );

    
    // Change Paragraph 2 text colour to red
    $("#2").css({"color":"red"});

    // When the mouse hovers over Paragraph 1, change its colour to blue
    $("#1").hover(function() {
        $(this).css({"color":"blue"});
    });

    // When Paragraph 3 is clicked, the heading fades out
    $("#3").click(function() {
        $("h1").fadeOut();
    });
});
</script>

</html>
